name: MAG Portal QA
on:
  push:
    paths:
      - 'mag/**'
      - '.github/workflows/mag-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backend syntax and tests
        run: |
          node --check mag/api/portal.js
          node --test mag/tests/portal.test.js
      - name: Simulate classic MAG TV menus, Favorites, search and video navigation
        run: |
          npm install --no-save --no-package-lock jsdom@25.0.1 acorn@8.15.0
          node --test mag/tests/client.test.js
      - name: Legacy Smart-TV browser syntax check
        run: |
          node - <<'JS'
          const fs=require('fs'),acorn=require('acorn');
          const html=fs.readFileSync('mag/c/index.html','utf8');
          const js=html.match(/<script>([\s\S]*?)<\/script>/);
          if(!js)throw Error('Missing classic portal script');
          acorn.parse(js[1],{ecmaVersion:5});
          console.log('PASS: MAG portal inline JavaScript parses as ECMAScript 5');
          JS
      - name: Check classic MAG menu and rewrite map
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,xml.etree.ElementTree as ET,re
          root=Path('mag')
          page=(root/'c/index.html').read_text()
          conf=json.loads((root/'vercel.json').read_text())
          ET.parse(root/'c/snwd-logo.svg')
          assert 'SNWD' in page and 'santhos' in page.lower()
          for key in ('home','tv','tamil','movies','sports','news','music','kids','search','guide','settings'):
              assert 'nav-'+key in page,key
          srcs=[r['source'] for r in conf['rewrites']]
          for path in ('/stalker_portal/server/load.php','/portal.php','/c/','/stalker_portal/c/index.html'):
              assert path in srcs,path
          assert 'videoPanel' in page
          print('PASS: 11 MAG navigation sections, vector logo, player and rewrites')
          PY
      - name: Validate deployed server handshake (nonblocking diagnostic)
        run: |
          curl -fLsS --max-time 15 \
            'https://santhos-iptv.vercel.app/stalker_portal/server/load.php?type=stb&action=handshake' \
            -o /tmp/handshake.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/handshake.json'))
          assert isinstance(x.get('js',{}).get('token'),str)
          assert len(x['js']['token']) >= 32
          print('PASS: live MAG portal handshake')
          PY
      - name: Validate live MAG portal pages, categories and play resolution
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,json
          host='https://santhos-iptv.vercel.app'
          def get(path):
              with urllib.request.urlopen(host+path, timeout=20) as r:
                  assert r.status==200,(path,r.status)
                  return r.read()
          page=get('/stalker_portal/c/index.html').decode('utf-8')
          assert 'SANTHOS IPTV' in page or 'SANTHOS <b>IPTV' in page
          assert 'nav-movies' in page and 'nav-tamil' in page
          logo=get('/c/snwd-logo.jpg')
          assert logo.startswith(bytes([255,216,255]))
          svg=get('/c/snwd-logo.svg').decode('utf-8')
          assert svg.startswith('<svg')
          url='/stalker_portal/server/load.php?type=itv&action=get_genres'
          genres=json.loads(get(url))['js']
          assert any(x['title']=='Tamil Movies' for x in genres)
          lst=json.loads(get('/stalker_portal/server/load.php?type=itv&action=get_ordered_list&genre=1&p=1'))['js']
          assert isinstance(lst['data'],list)
          assert lst['total_items']>=0
          all_channels=json.loads(get('/portal.php?type=itv&action=get_ordered_list&genre=%2A&p=1'))['js']
          assert len(all_channels['data'])>0
          chid=all_channels['data'][0]['id']
          link=json.loads(get('/portal.php?type=itv&action=create_link&ch_id='+urllib.parse.quote(str(chid))))['js']
          assert link['url'].startswith(('https://','http://'))
          print('PASS: live portal page, SNWD logo, categories, paging, live source resolver')
          PY
