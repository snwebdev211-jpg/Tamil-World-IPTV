name: Update IPTV playlists
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - 'custom/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generator syntax
        run: python -m py_compile tools/build.py
      - name: Validate category sorting and playlist format
        run: python -m unittest discover -s tests -v
      - name: Fetch and generate playlists
        run: python tools/build.py
      - name: Check stream compatibility for older Smart-STB players
        run: python tools/smartstb_filter.py
      - name: Probe MPEG-TS video segments for older Smart-STB
        run: python tools/legacy_filter.py
      - name: Prepare browser-hosted playlist copies
        run: |
          mkdir -p web/playlists
          cp playlists/all.m3u web/playlists/all.m3u
          cp playlists/all-sources.m3u web/playlists/all-sources.m3u
      - name: Publish refreshed playlists
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Save generated playlists outside the checkout. Never overwrite
          # the manually-maintained diagnostic samples on rebase/retry.
          mkdir -p /tmp/tamil-world-iptv-playlists
          rsync -a --exclude='diagnostic.m3u' playlists/ /tmp/tamil-world-iptv-playlists/
          mkdir -p /tmp/tamil-world-iptv-web-playlists
          rsync -a web/playlists/ /tmp/tamil-world-iptv-web-playlists/

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rsync -a --exclude='diagnostic.m3u' /tmp/tamil-world-iptv-playlists/ playlists/
            mkdir -p web/playlists
            rsync -a /tmp/tamil-world-iptv-web-playlists/ web/playlists/
            git add playlists/ web/playlists/
            if git diff --cached --quiet; then
              echo "No playlist changes"
              exit 0
            fi
            git commit -m 'chore: update public IPTV playlists'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote branch moved; retrying on top of latest main..."
          done
          echo "Could not publish playlist updates after 3 attempts" >&2
          exit 1
