name: Update IPTV playlists
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/**'
      - 'custom/**'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '17 4,16 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-playlists
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check generator syntax
        run: python -m py_compile tools/build.py
      - name: Validate category sorting and playlist format
        run: python -m unittest discover -s tests -v
      - name: Fetch and generate playlists
        run: python tools/build.py
      - name: Publish refreshed playlists
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add playlists/
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update public IPTV playlists'
            git push
          fi
