<script>
(function(){
'use strict';
var BASE='/stalker_portal/server/load.php?JsHttpRequest=1-xml&';
var nav='home',genre='*',channels=[],groups=[],page=1,playing=null,video=document.getElementById('video'),selected=0;
var lastCategory='tv',favoriteIds=[],recentIds=[],lastChannelFocus=null,showMode='normal';
var currentStreams=[],currentStreamIndex=0;
var contentEpoch=0;
function readStore(k){try{var v=JSON.parse(window.localStorage.getItem(k)||'[]');return Object.prototype.toString.call(v)==='[object Array]'?v:[];}catch(e){return [];}}
function persist(){try{window.localStorage.setItem('snwd_santhos_favorites',JSON.stringify(favoriteIds));window.localStorage.setItem('snwd_santhos_recent',JSON.stringify(recentIds));}catch(e){}}
favoriteIds=readStore('snwd_santhos_favorites');
recentIds=readStore('snwd_santhos_recent');
var focusables=[], searchTerm='';
function elem(s){return document.getElementById(s);}
function txt(x){return String(x===undefined||x===null?'':x);}
function escapeHTML(s){return txt(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function req(type,action,params,done){
 var xhr=new XMLHttpRequest(),query=BASE+'type='+encodeURIComponent(type)+'&action='+encodeURIComponent(action),k;
 for(k in params){if(params.hasOwnProperty(k))query+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}
 xhr.open('GET',query,true);xhr.timeout=11000;
 xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status===200){try{var obj=JSON.parse(xhr.responseText);done(null,obj.js);}catch(e){done('Invalid portal response');}}else{done('Portal HTTP '+xhr.status);}}};
 xhr.ontimeout=function(){done('Portal request timed out');};
 xhr.onerror=function(){done('Cannot connect to portal backend');};
 xhr.send(null);
}
function title(a,b){elem('main').innerHTML='<h1 class="headline">'+escapeHTML(a)+'</h1><p class="subhead">'+escapeHTML(b)+'</p><div id="status"></div><div id="cards"></div><div id="pageControls"></div>'; }
function message(x){if(elem('status'))elem('status').innerHTML=escapeHTML(x);}
function button(label,hint,action,icon){
 return '<button class="tile" data-action="'+escapeHTML(action)+'" onclick="tileAction(this)" type="button"><span class="icon">'+icon+'</span><span class="name">'+escapeHTML(label)+'</span><span class="hint">'+escapeHTML(hint)+'</span></button>';
}
function clock(){var d=new Date();elem('clock').innerHTML=d.toDateString().toUpperCase()+' &nbsp; '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function setNav(n){var els=document.getElementsByClassName('menu'),i;for(i=0;i<els.length;i++)els[i].className='menu'+(els[i].id==='nav-'+n?' active':'');}

var homeCarouselPage=0;
var homeCards=[
 {title:'MEDIA BROWSER',hint:'Your favorites',action:'favorites',kind:'library',symbol:'library'},
 {title:'TV',hint:'Live television',action:'tv',kind:'live',symbol:'tv'},
 {title:'VIDEO CLUB',hint:'Live movie channels',action:'movies',kind:'movies',symbol:'movies'},
 {title:'TAMIL TV',hint:'Tamil channels',action:'tamil',kind:'tamil',symbol:'tv'},
 {title:'SPORTS',hint:'Live sporting channels',action:'sports',kind:'sports',symbol:'sports'},
 {title:'NEWS',hint:'News channels',action:'news',kind:'news',symbol:'tv'},
 {title:'MUSIC',hint:'Music TV',action:'music',kind:'music',symbol:'music'},
 {title:'KIDS',hint:'Family channels',action:'kids',kind:'kids',symbol:'tv'}
];
function classicIcon(symbol){
 if(symbol==='tv')return '<svg viewBox="0 0 140 120" aria-hidden="true"><rect x="9" y="16" width="122" height="82" rx="9" fill="#243f4b" stroke="#f2ede3" stroke-width="6"/><rect x="18" y="25" width="104" height="64" fill="#27657e"/><path d="M25 36L73 28L50 82L18 82Z" fill="#64aabd"/><path d="M63 95h14v14H63ZM41 109h58" stroke="#e8e0d6" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="112" cy="87" r="2" fill="#c7e7db"/></svg>';
 if(symbol==='movies')return '<svg viewBox="0 0 140 120" aria-hidden="true"><circle cx="70" cy="58" r="47" fill="#f7c485" stroke="#fff0c8" stroke-width="6"/><circle cx="70" cy="58" r="12" fill="#8b3e4a"/><circle cx="70" cy="26" r="11" fill="#8b3e4a"/><circle cx="70" cy="90" r="11" fill="#8b3e4a"/><circle cx="38" cy="58" r="11" fill="#8b3e4a"/><circle cx="102" cy="58" r="11" fill="#8b3e4a"/><path d="M95 86l38 26H93Z" fill="#f2dab4"/></svg>';
 if(symbol==='sports')return '<svg viewBox="0 0 140 120" aria-hidden="true"><circle cx="70" cy="60" r="49" fill="#ddebea" stroke="#c1f4e7" stroke-width="5"/><path d="M51 49l19-17 23 15-7 28H56Z" fill="#164e63"/><path d="M36 28l22 20M104 31L91 47M27 77l29-4M113 76l-27-1M57 111l1-35M89 107l-3-32" stroke="#164e63" stroke-width="7" fill="none"/></svg>';
 if(symbol==='music')return '<svg viewBox="0 0 140 120" aria-hidden="true"><path d="M63 15v75l49-15V10Z" fill="#c8eff3" stroke="#fff" stroke-width="5"/><ellipse cx="45" cy="92" rx="22" ry="13" fill="#e8ffff"/><ellipse cx="94" cy="78" rx="22" ry="13" fill="#e8ffff"/></svg>';
 return '<svg viewBox="0 0 140 120" aria-hidden="true"><rect x="17" y="13" width="106" height="94" rx="10" fill="#cfdee7"/><rect x="26" y="24" width="88" height="72" rx="5" fill="#244e69"/><path d="M40 40h62M40 58h62M40 76h62" stroke="#a8cad9" stroke-width="6"/></svg>';
}
function homeCardHTML(c){
 return '<div class="classic-card-box"><button class="classic-tile" onclick="go(\''+c.action+'\')" title="'+escapeHTML(c.hint)+'"><span class="art '+c.kind+'">'+classicIcon(c.symbol)+'</span></button><p class="classic-tile-name">'+escapeHTML(c.title)+'</p></div>';
}
function changeHomeCarousel(shift){
 homeCarouselPage=(homeCarouselPage+shift+Math.ceil(homeCards.length/3))%Math.ceil(homeCards.length/3);
 renderHomeCarousel();
}
window.changeHomeCarousel=changeHomeCarousel;
function renderHomeCarousel(){
 var box=elem('classic-carousel-cards');
 if(!box)return;
 var start=homeCarouselPage*3,html='';
 for(var i=0;i<3;i++){
  var card=homeCards[(start+i)%homeCards.length];

function renderRows(items,total,current){
 var h='<button id="goBack" onclick="goBack()">← Back to categories</button>',i,c,marked;
 if(!items.length){elem('cards').innerHTML=h+'<div class="empty">No matching channels found. This may also indicate a temporary upstream outage.</div>';resetFocus();return;}
 for(i=0;i<items.length;i++){

 }

 var controls='';
 if(current>1)controls+='<button onclick="changePage(-1)">← PREVIOUS</button>';

function toggleFavorite(id){

function loadSavedChannels(mode){

 showMode=mode;lastCategory=mode;
 title(mode==='favorites'?'Your Favorites':'Recently Watched',mode==='favorites'?'Saved on this TV or browser':'Your recently opened channels');
 message('Loading your saved channels…');
 req('itv','get_all_channels',{},function(err,response){
  if(epoch!==contentEpoch)return;
  if(err){message(err);return;}
  var all=response.data||response||[],ids=mode==='favorites'?favoriteIds:recentIds;
  var selected=[],j,i;
  for(j=0;j<ids.length;j++)for(i=0;i<all.length;i++)if(String(all[i].id)===String(ids[j])){selected.push(all[i]);break;}
  renderRows(selected,selected.length,1);
  message(selected.length+' saved channel'+(selected.length===1?'':'s')+' on this device');
 });
}

window.chooseChannel=chooseChannel;
var playbackTimer=null, isTestVideo=false;
function videoMessage(text,show){
 elem('message').innerHTML=escapeHTML(text);
 elem('message').style.display=show?'block':'none';
 elem('playerStatus').innerHTML=escapeHTML(text);
}
function playUrl(source,label,isDiagnostic){
 isTestVideo=!!isDiagnostic;
 elem('videoPanel').style.display='block';
 elem('playerTitle').innerHTML=escapeHTML(label);
 videoMessage('Connecting to video…',false);
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 try {
  // On supported MAG clients, the native player may be required for HLS.
  if(window.stb && typeof window.stb.Play==='function'){
   try {
    if(typeof window.stb.Stop==='function')window.stb.Stop();
    if(typeof window.stb.SetVideoControlState==='function')window.stb.SetVideoControlState(1);
    window.stb.Play('ffmpeg '+source);
    video.style.display='none';
    videoMessage('Playback sent to MAG native player. If screen is black, this does not confirm video works.',false);
    return;
   }catch(nativeError){video.style.display='block';}
  }
  video.style.display='block';
  video.pause();video.src=source;video.load();
  var promise=video.play();
  if(promise&&typeof promise['catch']==='function')promise['catch'](function(){
   videoMessage('Could not start in the built-in player. Try a different channel or player.',true);
  });
  playbackTimer=setTimeout(function(){
   if(elem('videoPanel').style.display==='block' && video.readyState<2)
    videoMessage('No playable video received. The stream may be unavailable, geo-blocked or incompatible with this TV.',true);
  },16000);
 }catch(e){videoMessage('This device could not start playback.',true);}
}
function startSelectedStream(){
 isTestVideo=false;
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 var source=currentStreams[currentStreamIndex];
 if(!source){videoMessage('No source is available for this channel.',true);return;}
 videoMessage('Connecting to source '+(currentStreamIndex+1)+' of '+currentStreams.length+'…',false);
 try {
  if(window.stb&&typeof window.stb.Play==='function'){
   try {
    if(typeof window.stb.Stop==='function')window.stb.Stop();
    if(typeof window.stb.SetVideoControlState==='function')window.stb.SetVideoControlState(1);
    window.stb.Play('ffmpeg '+source);
    video.style.display='none';
    elem('playerStatus').innerHTML='Sent to MAG player · Source '+(currentStreamIndex+1)+' of '+currentStreams.length+' (video not yet verified)';
    return;
   }catch(nativeError){video.style.display='block';}
  }
  video.style.display='block';
  video.pause();video.src=source;video.load();
  var promise=video.play();
  if(promise&&promise['catch'])promise['catch'](function(){
   videoMessage('Playback blocked or unsupported. Press Retry to try another source.',true);
  });
  playbackTimer=setTimeout(function(){
    if(elem('videoPanel').style.display!=='block'||video.readyState>=2)return;
    if(currentStreamIndex+1<currentStreams.length){
      currentStreamIndex++;
      startSelectedStream();
    }else{
      videoMessage('No playable video received. Try a different channel or check your TV decoder.',true);
    }
  },16000);
 }catch(e){videoMessage('This device cannot play the selected stream.',true);}
}
function play(id){
 req('itv','create_link',{ch_id:id},function(err,r){
  if(err||!r||!r.url){message('This stream is not available: '+(err||'Unknown channel'));return;}
  var links=[r.url].concat(r.alternatives||[]),deduped=[];
  for(var x=0;x<links.length;x++)if(links[x]&&deduped.indexOf(links[x])===-1)deduped.push(links[x]);
  currentStreams=deduped;currentStreamIndex=0;
  playing=String(id);
  recentIds=[playing].concat(recentIds.filter(function(x){return String(x)!==playing;})).slice(0,40);
  persist();
  elem('videoPanel').style.display='block';
  elem('playerTitle').innerHTML='SANTHOS IPTV · CHANNEL '+escapeHTML(playing);
  startSelectedStream();
 });
}
function testPlayback(){
 playing=null;currentStreams=[];currentStreamIndex=0;
 playUrl('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8','HLS DIAGNOSTIC · TEST VIDEO',true);
}
window.testPlayback=testPlayback;
function closeVideo(){
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 try{if(window.stb&&typeof window.stb.Stop==='function')window.stb.Stop();}catch(_){}
 video.pause();video.removeAttribute('src');video.load();video.style.display='block';
 elem('videoPanel').style.display='none';elem('message').style.display='none';
 currentStreams=[];currentStreamIndex=0;isTestVideo=false;
 if(lastChannelFocus&&lastChannelFocus.focus)lastChannelFocus.focus();
}
window.closeVideo=closeVideo;
function retryStream(){
 if(isTestVideo){testPlayback();return;}
 if(!playing)return;
 if(currentStreams.length>1){
  currentStreamIndex=(currentStreamIndex+1)%currentStreams.length;
  startSelectedStream();
 }else play(playing);
}
window.retryStream=retryStream;
function switchStream(n){
 var rows=document.querySelectorAll('.row'),id=-1,i;
 for(i=0;i<rows.length;i++)if(rows[i].getAttribute('data-channel')===playing)id=i;
 if(rows.length)play(rows[(id+n+rows.length)%rows.length].getAttribute('data-channel'));
}
function nextStream(){switchStream(1);}function prevStream(){switchStream(-1);}
window.nextStream=nextStream;window.prevStream=prevStream;
function emptyPage(name,desc){
 title(name,desc);elem('cards').innerHTML='<div class="empty">'+escapeHTML(desc)+'</div>';resetFocus();
}
function go(next){
 ++contentEpoch; // Ignore stale responses from a screen we've left.
 if(next!=='home')document.body.className='';
 if(next.indexOf('group:')===0){lastCategory=nav;nav=next;showMode='normal';setNav(lastCategory);loadGroup(next.slice(6));return;}
 nav=next;setNav(next);showMode='normal';
 if(next==='favorites'||next==='recent'){loadSavedChannels(next);return;}
 if(next==='home')return home();
 if(next==='guide')return emptyPage('TV Guide','EPG schedules have not been supplied by the broadcasters. Live channel browsing is available under TV.');
 if(next==='settings'){
  title('Santhos IPTV · Settings','Powered by SNWD');
  elem('cards').innerHTML='<div class="empty"><b>SANTHOS IPTV · SNWD DIAGNOSTICS</b><p>Test your TV decoder separately from live channels using the sample video below. If that fails too, old TV codec support, TLS/HTTPS or network settings may be responsible.</p><button class="row" onclick="testPlayback()">▶ PLAY SAMPLE HLS VIDEO (NOT A TV CHANNEL)</button><button class="row" onclick="retryPortal()">↻ RECONNECT MAG PORTAL</button><p>If the sample works but live TV does not, broadcaster links or regional restrictions are more likely.</p><p>Original playlist remains on GitHub. Back = previous screen. OK = select. Full on-demand movies and EPG are not yet populated.</p></div>';
  resetFocus();return;
 }
 if(next==='search'){
  title('Channel Search','Enter a channel name and press Search.');
  elem('cards').innerHTML='<input id="filter" placeholder="Search channels by name" type="text"><button class="row" onclick="searchNow()">SEARCH CHANNELS</button>';resetFocus();return;
 }
 categoryScreen(next);
}
window.go=go;
function searchNow(){var f=elem('filter');if(!f)return;searchTerm=f.value.toLowerCase().slice(0,80);genre='*';page=1;nav='search';loadPage();}
window.searchNow=searchNow;
function goBack(){if(elem('videoPanel').style.display==='block'){closeVideo();return;}if(nav.indexOf('group:')===0){go(lastCategory);return;}go('home');}
window.goBack=goBack;
function changePage(n){page=Math.max(1,page+n);loadPage();}
window.changePage=changePage;
function resetFocus(){selected=0;setTimeout(function(){var targets=elem('main').getElementsByTagName('button');if(targets.length){targets[0].focus();if(targets[0].scrollIntoView)targets[0].scrollIntoView(false);}},70);}
function allFocus(){
 var list=document.getElementsByTagName('button'),out=[],i,b,rect,isPlaying=elem('videoPanel').style.display==='block';
 for(i=0;i<list.length;i++){
  b=list[i];rect=b.getBoundingClientRect();
  if(rect.width&&rect.height&&(!isPlaying||elem('videoPanel').contains(b)))out.push(b);
 }
 return out;
}
function activateFocused(){
 var a=document.activeElement;
 if(!a||a===document.body){var all=allFocus();a=all.length?all[0]:null;}
 if(a&&typeof a.click==='function'){a.click();return true;}
 if(a&&document.createEvent){var e=document.createEvent('MouseEvents');e.initEvent('click',true,true);a.dispatchEvent(e);return true;}
 return false;
}
function handleRemote(ev){
 ev=ev||window.event;
 var k=ev.keyCode||ev.which,t=ev.target||ev.srcElement;
 var isInput=t&&t.tagName==='INPUT';
 if(isInput&&k!==27&&k!==461&&k!==10009&&k!==8&&k!==13)return true;
 if(k===8||k===27||k===461||k===10009){if(ev.preventDefault)ev.preventDefault();ev.returnValue=false;goBack();return false;}
 if(k===13||k===29443){if(ev.preventDefault)ev.preventDefault();ev.returnValue=false;if(isInput){searchNow();return false;}activateFocused();return false;}
 if(k!==37&&k!==38&&k!==39&&k!==40)return true;
 if(ev.preventDefault)ev.preventDefault();
 ev.returnValue=false;
 var all=allFocus(),a=document.activeElement,i,b,r,dx,dy,primary,secondary,score,best=1e20,win=null;
 if(!a||!a.getBoundingClientRect||all.indexOf(a)<0){if(all.length)all[0].focus();return false;}
 var cur=a.getBoundingClientRect(),cx=cur.left+cur.width/2,cy=cur.top+cur.height/2;
 for(i=0;i<all.length;i++){
  b=all[i];if(b===a)continue;
  r=b.getBoundingClientRect();dx=(r.left+r.width/2)-cx;dy=(r.top+r.height/2)-cy;
  if((k===37&&dx>=-8)||(k===39&&dx<=8)||(k===38&&dy>=-8)||(k===40&&dy<=8))continue;
  primary=(k===37||k===39)?Math.abs(dx):Math.abs(dy);
  secondary=(k===37||k===39)?Math.abs(dy):Math.abs(dx);
  score=primary+secondary*3;
  if(score<best){best=score;win=b;}
 }
 if(win){win.focus();if(win.scrollIntoView)win.scrollIntoView(false);}
 return false;
}
document.addEventListener('keydown',handleRemote,true);

video.onerror=function(){
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 if(!isTestVideo&&currentStreamIndex+1<currentStreams.length){
  currentStreamIndex++;
  startSelectedStream();
 } else {
  videoMessage('No working source on this device. This may be a codec, location, or broadcaster restriction. Choose another channel.',true);
 }
};
video.onplaying=function(){if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}videoMessage(isTestVideo?'Diagnostic video playing':'Live video playing',false);};
clock();setInterval(clock,60000);
var connectionError='',connecting=false;
function connectPortal(){
 if(connecting)return;
 connecting=true;
 req('stb','handshake',{},function(error,token){
  if(error||!token||!token.token){
   connecting=false;
   connectionError='Unable to reach portal server. Check your internet connection and retry.';
   go('home');message(connectionError);return;
  }
  req('itv','get_genres',{},function(err,foundGroups){
   if(err||!foundGroups||!foundGroups.length){
    connecting=false;
    connectionError='Channel categories unavailable. Press RETRY CONNECTION.';
    go('home');message(connectionError);return;
   }
   groups=foundGroups;
   req('itv','get_ordered_list',{genre:'*',p:1},function(lastError,data){
    connecting=false;
    if(lastError||!data){
     connectionError='Channel directory could not be loaded. Press RETRY CONNECTION.';
    }else{
     channels.length=Number(data.total_items)||0;
     connectionError='';
    }
    go('home');
    if(connectionError)message(connectionError);
   });
  });
 });
}
function retryPortal(){connectionError='';connectPortal();}
window.retryPortal=retryPortal;
connectPortal();
})();
