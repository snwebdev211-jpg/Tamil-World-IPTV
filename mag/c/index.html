<body>
<div id="outer">
<div id="top">
<img id="logo" src="/c/snwd-logo.jpg" alt="SNWD company logo" onerror="this.onerror=null;this.src='/c/snwd-logo.svg';">
<div id="brand">SANTHOS <b>IPTV</b></div>

</div>
<div id="layout">
<div id="sidebar"><div class="group-title">Main Menu</div>
<button id="nav-home" class="menu active" onclick="go('home')">⌂ &nbsp; Home</button>
<button id="nav-tv" class="menu" onclick="go('tv')">▣ &nbsp; Live TV</button>
<button id="nav-tamil" class="menu" onclick="go('tamil')">அ &nbsp; Tamil TV</button>

<button id="nav-sports" class="menu" onclick="go('sports')">◉ &nbsp; Sports</button>
<button id="nav-news" class="menu" onclick="go('news')">⌁ &nbsp; News</button>
<button id="nav-music" class="menu" onclick="go('music')">♫ &nbsp; Music</button>
<button id="nav-kids" class="menu" onclick="go('kids')">✳ &nbsp; Kids</button>

</div>

<div id="playerTop"><span id="playerTitle">TV</span><button id="closePlayer" onclick="closeVideo()">✕ &nbsp; BACK</button></div>

<div id="message"></div>
</div>

<script>
(function(){
'use strict';
var BASE='/stalker_portal/server/load.php?JsHttpRequest=1-xml&';
var nav='home',genre='*',channels=[],groups=[],page=1,playing=null,video=document.getElementById('video'),selected=0;
var lastCategory='tv',favoriteIds=[],recentIds=[],lastChannelFocus=null,showMode='normal';
var currentStreams=[],currentStreamIndex=0;
var contentEpoch=0;
function readStore(k){try{var v=JSON.parse(window.localStorage.getItem(k)||'[]');return Object.prototype.toString.call(v)==='[object Array]'?v:[];}catch(e){return [];}}
function persist(){try{window.localStorage.setItem('snwd_santhos_favorites',JSON.stringify(favoriteIds));window.localStorage.setItem('snwd_santhos_recent',JSON.stringify(recentIds));}catch(e){}}
favoriteIds=readStore('snwd_santhos_favorites');
recentIds=readStore('snwd_santhos_recent');
var focusables=[], searchTerm='';
function elem(s){return document.getElementById(s);}
function txt(x){return String(x===undefined||x===null?'':x);}
function escapeHTML(s){return txt(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function req(type,action,params,done){
 var xhr=new XMLHttpRequest(),query=BASE+'type='+encodeURIComponent(type)+'&action='+encodeURIComponent(action),k;
 for(k in params){if(params.hasOwnProperty(k))query+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}
 xhr.open('GET',query,true);xhr.timeout=11000;
 var completed=false;function finish(err,data){if(completed)return;completed=true;done(err,data);}xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status===200){try{var obj=JSON.parse(xhr.responseText);finish(null,obj.js);}catch(e){finish('Invalid portal response');}}else{finish('Portal HTTP '+xhr.status);}}};
 xhr.ontimeout=function(){finish('Portal request timed out');};
 xhr.onerror=function(){finish('Cannot connect to portal backend');};
 xhr.send(null);
 setTimeout(function(){finish('Portal connection timed out');},12000);
}
function title(a,b){elem('main').innerHTML='<h1 class="headline">'+escapeHTML(a)+'</h1><p class="subhead">'+escapeHTML(b)+'</p><div id="status"></div><div id="cards"></div><div id="pageControls"></div>'; }
function message(x){if(elem('status'))elem('status').innerHTML=escapeHTML(x);}
function button(label,hint,action,icon){
 return '<button class="tile" data-action="'+escapeHTML(action)+'" onclick="tileAction(this)" type="button"><span class="icon">'+icon+'</span><span class="name">'+escapeHTML(label)+'</span><span class="hint">'+escapeHTML(hint)+'</span></button>';
}
function clock(){var d=new Date();elem('clock').innerHTML=d.toDateString().toUpperCase()+' &nbsp; '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function setNav(n){var els=document.getElementsByClassName('menu'),i;for(i=0;i<els.length;i++)els[i].className='menu'+(els[i].id==='nav-'+n?' active':'');}

var homeCarouselPage=1,homeCatIndex=2;
var homeCards=[
 {title:'MEDIA BROWSER',hint:'Network media sources',action:'mediabrowser',photo:'/c/mag-media.jpg'},
 {title:'TV',hint:'Television channels',action:'tv',photo:'/c/mag-tv.jpg'},
 {title:'VIDEOCLUB',hint:'On-demand catalogue',action:'videoclub',photo:'/c/mag-videoclub.jpg'}
];
var homeChoices=[
 {title:'CULTURE',action:'culture'},
 {title:'TAMIL TV',action:'tamil'},
 {title:'ALL',action:'tv'},
 {title:'INFORMATION',action:'news'},
 {title:'ENTERTAINMENT',action:'entertainment'},
 {title:"CHILDREN'S",action:'kids'}
];
function classicGroupButton(i){
 var c=homeChoices[i];
 return '<button class="classic-category'+(homeCatIndex===i?' is-selected':'')+'" style="top:'+(10.2+i*14.05)+'%" data-cat="'+i+'" onclick="selectHomeCat('+i+',true)">'+escapeHTML(c.title)+'</button>';
}
function selectHomeCat(i,open){
 homeCatIndex=i;renderHomeCategories();
 if(open)go(homeChoices[i].action);
}
window.selectHomeCat=selectHomeCat;
function renderHomeCategories(){
 var box=elem('magCategories');
 if(!box)return;
 var h='<div class="classic-category-head">UP</div>';
 for(var i=0;i<homeChoices.length;i++)h+=classicGroupButton(i);
 box.innerHTML=h;
}
function homeCardHTML(c,i){
 var classes=['mag-left','mag-center','mag-right'];
 return '<div class="classic-card-box '+classes[i]+(homeCarouselPage===i?' mag-active':'')+'"><button class="classic-tile" data-module="'+i+'" onclick="selectHomeModule('+i+',true)" title="'+escapeHTML(c.hint)+'"><img src="'+c.photo+'" alt="'+escapeHTML(c.title)+'"></button><div class="classic-tile-name">'+escapeHTML(c.title)+'</div></div>';
}
function selectHomeModule(i,open){
 homeCarouselPage=(i+3)%3;renderHomeCarousel();
 if(open)go(homeCards[homeCarouselPage].action);
}
window.selectHomeModule=selectHomeModule;
function changeHomeCarousel(shift){selectHomeModule(homeCarouselPage+shift,false);}
window.changeHomeCarousel=changeHomeCarousel;
function renderHomeCarousel(){
 var box=elem('classic-carousel-cards');
 if(!box)return;
 var html='';
 for(var i=0;i<3;i++)html+=homeCardHTML(homeCards[i],i);
 box.innerHTML=html;
}
function home(){
 document.body.className='is-home';
 title('Santhos IPTV','Powered by SNWD');
 elem('cards').innerHTML=
 '<div class="classic-home">'+
  '<div class="classic-main"><div id="magCategories" class="classic-categories"></div>'+
  '<div class="classic-right"><div class="right-seal">SNWD</div><strong>SANTHOS IPTV</strong>'+
  '<p>YOUR WORLD ON SCREEN</p><p id="mag-info">Connecting to your channel directory…</p></div></div>'+
  '<div class="classic-carousel"><div id="classic-carousel-cards"></div></div>'+
 '</div>';
 renderHomeCategories();
 renderHomeCarousel();
 var info=elem('mag-info');
 if(info&&groups.length)info.innerHTML='TV CHANNELS<br>'+channels.length+' streams in the directory';
}
function tileAction(el){go(el.getAttribute('data-action'));}
window.tileAction=tileAction;
var magTarget='tv',magGroupIndex=0,magRowIndex=0,magPane=0,magPages=1,magFilteredGroups=[],magPageItems=[];
function matchingGroups(target){
 var out=[],i,c,t;
 for(i=0;i<groups.length;i++){
  c=groups[i];if(c.id==='*')continue;t=(c.title||'').toLowerCase();
  if(target==='tamil'&&(c.alias||'').indexOf('Tamil |')!==0)continue;
  if(target==='entertainment'&&t.indexOf('entertain')<0)continue;
  if(target==='culture'&&t.indexOf('culture')<0)continue;
  if(target==='movies'&&t.indexOf('movie')<0)continue;
  if(target==='sports'&&t.indexOf('sport')<0)continue;
  if(target==='news'&&t.indexOf('news')<0&&t.indexOf('information')<0)continue;
  if(target==='music'&&t.indexOf('music')<0)continue;
  if(target==='kids'&&t.indexOf('kids')<0&&t.indexOf('family')<0)continue;
  out.push(c);
 }
 return out;
}
function categoryScreen(target){
 magTarget=target;magFilteredGroups=[{id:'*',title:'ALL CHANNELS'}].concat(matchingGroups(target));
 magGroupIndex=0;magRowIndex=0;magPane=0;page=1;genre='*';searchTerm='';
 drawMagBrowser();loadMagChannels();
}
function drawMagBrowser(){
 title('TV','SELECT A CATEGORY AND CHANNEL');
 elem('cards').innerHTML='<div class="mag-browser"><div class="mag-groups" id="magGroups"></div><div class="mag-list" id="magList"></div></div>';
 renderMagGroups();renderMagEntries();
}
function renderMagGroups(){
 var e=elem('magGroups');if(!e)return;
 var start=Math.max(0,magGroupIndex-3);if(start>magFilteredGroups.length-7)start=Math.max(0,magFilteredGroups.length-7);
 var h='',i,g;
 for(i=start;i<Math.min(start+7,magFilteredGroups.length);i++){
  g=magFilteredGroups[i];
  h+='<button class="mag-group'+(magPane===0&&magGroupIndex===i?' mag-selected':'')+'" onclick="chooseMagGroup('+i+')" data-group="'+escapeHTML(g.id)+'">'+escapeHTML(g.title)+'</button>';
 }
 e.innerHTML=h||'<div class="empty">No channel categories.</div>';
}
function renderMagEntries(){
 var e=elem('magList');if(!e)return;
 var h='',i,ch,start=Math.max(0,magRowIndex-3);
 if(start>magPageItems.length-7)start=Math.max(0,magPageItems.length-7);
 if(!magPageItems.length)h='<div class="empty">No channels found in this category.</div>';
 for(i=start;i<Math.min(start+7,magPageItems.length);i++){
  ch=magPageItems[i];
  h+='<button class="mag-entry row'+(magPane===1&&magRowIndex===i?' mag-selected':'')+'" data-channel="'+escapeHTML(ch.id)+'" onclick="chooseMagChannel('+i+')">'+escapeHTML(ch.number+'. '+ch.name)+'</button>';
 }
 e.innerHTML=h;
}
function chooseMagGroup(i){
 if(i<0||i>=magFilteredGroups.length)return;
 magGroupIndex=i;magRowIndex=0;magPane=0;page=1;
 genre=magFilteredGroups[i].id;
 renderMagGroups();loadMagChannels();
}
window.chooseMagGroup=chooseMagGroup;
function chooseMagChannel(i){
 if(!magPageItems[i])return;
 magRowIndex=i;magPane=1;renderMagEntries();
 lastChannelFocus=null;play(magPageItems[i].id);
}
window.chooseMagChannel=chooseMagChannel;
function loadMagChannels(){
 var epoch=++contentEpoch;
 message('Loading channels…');
 req('itv','get_ordered_list',{genre:genre,p:page,search:searchTerm},function(err,response){
  if(epoch!==contentEpoch)return;
  if(err||!response||response.error){magPageItems=[];message(err||(response&&response.error)||'Cannot load channels');renderMagEntries();return;}
  magPageItems=response.data||[];magPages=Math.max(1,Math.ceil((Number(response.total_items)||0)/50));
  magRowIndex=0;renderMagEntries();message((Number(response.total_items)||0)+' channels · page '+page+'/'+magPages+' · LEFT/RIGHT: category/channel');
 });
}
function navigateMag(dir){
 if(dir===37)magPane=0;
 else if(dir===39)magPane=1;
 else if(dir===38){
  if(magPane===0)magGroupIndex=(magGroupIndex-1+magFilteredGroups.length)%magFilteredGroups.length;
  else magRowIndex=Math.max(0,magRowIndex-1);
 }else if(dir===40){
  if(magPane===0)magGroupIndex=(magGroupIndex+1)%magFilteredGroups.length;
  else magRowIndex=Math.min(Math.max(magPageItems.length-1,0),magRowIndex+1);
 }
 renderMagGroups();renderMagEntries();
}
function renderRows(items,total,current){
 var h='<button id="goBack" onclick="goBack()">← Back to categories</button>',i,c,marked;
 if(!items.length){elem('cards').innerHTML=h+'<div class="empty">No matching channels found. This may also indicate a temporary upstream outage.</div>';resetFocus();return;}
 for(i=0;i<items.length;i++){
   c=items[i];var number=escapeHTML(c.number),name=escapeHTML(c.name);
   marked=favoriteIds.indexOf(String(c.id))!==-1;
   h+='<div class="channel-line"><button class="row" data-channel="'+escapeHTML(c.id)+'" onclick="chooseChannel(this)" type="button">'+(c.logo?'<img src="'+escapeHTML(c.logo)+'" alt="" onerror="this.style.display=\'none\'">':'')+number+'. '+name+'<small>LIVE &nbsp;·&nbsp; Select to try playback</small></button><button class="star" onclick="toggleFavorite(\''+escapeHTML(c.id)+'\')" title="'+(marked?'Remove favorite':'Save favorite')+'">'+(marked?'♥':'♡')+'</button></div>';
 }
 elem('cards').innerHTML=h;
 var controls='';
 if(current>1)controls+='<button onclick="changePage(-1)">← PREVIOUS</button>';
 if(current*50<total)controls+='<button onclick="changePage(1)">NEXT →</button>';
 controls+=' &nbsp; '+escapeHTML('Page '+current+' · '+total+' channels');
 elem('pageControls').innerHTML=controls;
 message('TV channels · '+total+' total · some streams may fail depending on location or codec.');
 resetFocus();
}
function loadGroup(id){
 genre=id||'*';page=1;searchTerm='';loadPage();
}
function loadPage(){
 var epoch=++contentEpoch;
 showMode='normal';
 title('Live Channels','Select a channel to play. Use Previous / Next to browse.');
 message('Loading channel list…');
 req('itv','get_ordered_list',{genre:genre,p:page,search:searchTerm},function(err,response){
  if(epoch!==contentEpoch)return;
  if(err){message(err);return;}
  var items=response.data||[];
  renderRows(items,Number(response.total_items)||0,page);
 });
}
function chooseChannel(el){lastChannelFocus=el;play(el.getAttribute('data-channel'));}
function toggleFavorite(id){
 id=String(id);var i=favoriteIds.indexOf(id);
 if(i>=0)favoriteIds.splice(i,1);else favoriteIds.unshift(id);
 persist();
 if(showMode==='favorites'||showMode==='recent')loadSavedChannels(showMode);else loadPage();
}
window.toggleFavorite=toggleFavorite;
function loadSavedChannels(mode){
 var epoch=++contentEpoch;
 showMode=mode;lastCategory=mode;
 title(mode==='favorites'?'Your Favorites':'Recently Watched',mode==='favorites'?'Saved on this TV or browser':'Your recently opened channels');
 message('Loading your saved channels…');
 req('itv','get_all_channels',{},function(err,response){
  if(epoch!==contentEpoch)return;
  if(err){message(err);return;}
  var all=response.data||response||[],ids=mode==='favorites'?favoriteIds:recentIds;
  var selected=[],j,i;
  for(j=0;j<ids.length;j++)for(i=0;i<all.length;i++)if(String(all[i].id)===String(ids[j])){selected.push(all[i]);break;}
  renderRows(selected,selected.length,1);
  message(selected.length+' saved channel'+(selected.length===1?'':'s')+' on this device');
 });
}

window.chooseChannel=chooseChannel;
var playbackTimer=null, isTestVideo=false;
function videoMessage(text,show){
 elem('message').innerHTML=escapeHTML(text);
 elem('message').style.display=show?'block':'none';
 elem('playerStatus').innerHTML=escapeHTML(text);
}
function playUrl(source,label,isDiagnostic){
 isTestVideo=!!isDiagnostic;
 elem('videoPanel').style.display='block';
 elem('playerTitle').innerHTML=escapeHTML(label);
 videoMessage('Connecting to video…',false);
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 try {
  // On supported MAG clients, the native player may be required for HLS.
  if(window.stb && typeof window.stb.Play==='function'){
   try {
    if(typeof window.stb.Stop==='function')window.stb.Stop();
    if(typeof window.stb.SetVideoControlState==='function')window.stb.SetVideoControlState(1);
    window.stb.Play('ffmpeg '+source);
    video.style.display='none';
    videoMessage('Playback sent to MAG native player. If screen is black, this does not confirm video works.',false);
    return;
   }catch(nativeError){video.style.display='block';}
  }
  video.style.display='block';
  video.pause();video.src=source;video.load();
  var promise=video.play();
  if(promise&&typeof promise['catch']==='function')promise['catch'](function(){
   videoMessage('Could not start in the built-in player. Try a different channel or player.',true);
  });
  playbackTimer=setTimeout(function(){
   if(elem('videoPanel').style.display==='block' && video.readyState<2)
    videoMessage('No playable video received. The stream may be unavailable, geo-blocked or incompatible with this TV.',true);
  },16000);
 }catch(e){videoMessage('This device could not start playback.',true);}
}
function startSelectedStream(){
 isTestVideo=false;
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 var source=currentStreams[currentStreamIndex];
 if(!source){videoMessage('No source is available for this channel.',true);return;}
 videoMessage('Connecting to source '+(currentStreamIndex+1)+' of '+currentStreams.length+'…',false);
 try {
  if(window.stb&&typeof window.stb.Play==='function'){
   try {
    if(typeof window.stb.Stop==='function')window.stb.Stop();
    if(typeof window.stb.SetVideoControlState==='function')window.stb.SetVideoControlState(1);
    window.stb.Play('ffmpeg '+source);
    video.style.display='none';
    elem('playerStatus').innerHTML='Sent to MAG player · Source '+(currentStreamIndex+1)+' of '+currentStreams.length+' (video not yet verified)';
    return;
   }catch(nativeError){video.style.display='block';}
  }
  video.style.display='block';
  video.pause();video.src=source;video.load();
  var promise=video.play();
  if(promise&&promise['catch'])promise['catch'](function(){
   videoMessage('Playback blocked or unsupported. Press Retry to try another source.',true);
  });
  playbackTimer=setTimeout(function(){
    if(elem('videoPanel').style.display!=='block'||video.readyState>=2)return;
    if(currentStreamIndex+1<currentStreams.length){
      currentStreamIndex++;
      startSelectedStream();
    }else{
      videoMessage('No playable video received. Try a different channel or check your TV decoder.',true);
    }
  },16000);
 }catch(e){videoMessage('This device cannot play the selected stream.',true);}
}
function play(id){
 req('itv','create_link',{ch_id:id},function(err,r){
  if(err||!r||!r.url){message('This stream is not available: '+(err||'Unknown channel'));return;}
  var links=[r.url].concat(r.alternatives||[]),deduped=[];
  for(var x=0;x<links.length;x++)if(links[x]&&deduped.indexOf(links[x])===-1)deduped.push(links[x]);
  currentStreams=deduped;currentStreamIndex=0;
  playing=String(id);
  recentIds=[playing].concat(recentIds.filter(function(x){return String(x)!==playing;})).slice(0,40);
  persist();
  elem('videoPanel').style.display='block';
  elem('playerTitle').innerHTML='SANTHOS IPTV · CHANNEL '+escapeHTML(playing);
  startSelectedStream();
 });
}
function testPlayback(){
 playing=null;currentStreams=[];currentStreamIndex=0;
 playUrl('https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8','HLS DIAGNOSTIC · TEST VIDEO',true);
}
window.testPlayback=testPlayback;
function closeVideo(){
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 try{if(window.stb&&typeof window.stb.Stop==='function')window.stb.Stop();}catch(_){}
 video.pause();video.removeAttribute('src');video.load();video.style.display='block';
 elem('videoPanel').style.display='none';elem('message').style.display='none';
 currentStreams=[];currentStreamIndex=0;isTestVideo=false;
 if(lastChannelFocus&&lastChannelFocus.focus)lastChannelFocus.focus();
}
window.closeVideo=closeVideo;
function retryStream(){
 if(isTestVideo){testPlayback();return;}
 if(!playing)return;
 if(currentStreams.length>1){
  currentStreamIndex=(currentStreamIndex+1)%currentStreams.length;
  startSelectedStream();
 }else play(playing);
}
window.retryStream=retryStream;
function switchStream(n){
 var rows=document.querySelectorAll('.row'),id=-1,i;
 for(i=0;i<rows.length;i++)if(rows[i].getAttribute('data-channel')===playing)id=i;
 if(rows.length)play(rows[(id+n+rows.length)%rows.length].getAttribute('data-channel'));
}
function nextStream(){switchStream(1);}function prevStream(){switchStream(-1);}
window.nextStream=nextStream;window.prevStream=prevStream;
function emptyPage(name,desc){
 title(name,desc);elem('cards').innerHTML='<div class="empty">'+escapeHTML(desc)+'</div>';resetFocus();
}
function go(next){
 ++contentEpoch; // Ignore stale responses from a screen we've left.
 if(next!=='home')document.body.className='';
 if(next.indexOf('group:')===0){lastCategory=nav;nav=next;showMode='normal';setNav(lastCategory);loadGroup(next.slice(6));return;}
 nav=next;setNav(next);showMode='normal';
 if(next==='favorites'||next==='recent'){loadSavedChannels(next);return;}
 if(next==='home')return home();
 if(next==='guide')return emptyPage('TV Guide','EPG schedules have not been supplied by the broadcasters. Live channel browsing is available under TV.');
 if(next==='settings'){
  title('Santhos IPTV · Settings','Powered by SNWD');
  elem('cards').innerHTML='<div class="empty"><b>SANTHOS IPTV · SNWD DIAGNOSTICS</b><p>Test your TV decoder separately from live channels using the sample video below. If that fails too, old TV codec support, TLS/HTTPS or network settings may be responsible.</p><button class="row" onclick="testPlayback()">▶ PLAY SAMPLE HLS VIDEO (NOT A TV CHANNEL)</button><button class="row" onclick="retryPortal()">↻ RECONNECT MAG PORTAL</button><p>If the sample works but live TV does not, broadcaster links or regional restrictions are more likely.</p><p>Original playlist remains on GitHub. Back = previous screen. OK = select. Full on-demand movies and EPG are not yet populated.</p></div>';
  resetFocus();return;
 }
 if(next==='search'){
  title('Channel Search','Enter a channel name and press Search.');
  elem('cards').innerHTML='<input id="filter" placeholder="Search channels by name" type="text"><button class="row" onclick="searchNow()">SEARCH CHANNELS</button>';resetFocus();return;
 }
 categoryScreen(next);
}
window.go=go;
function searchNow(){var f=elem('filter');if(!f)return;searchTerm=f.value.toLowerCase().slice(0,80);genre='*';page=1;nav='search';loadPage();}
window.searchNow=searchNow;
function goBack(){if(elem('videoPanel').style.display==='block'){closeVideo();return;}if(nav.indexOf('group:')===0){go(lastCategory);return;}go('home');}
window.goBack=goBack;
function changePage(n){page=Math.max(1,page+n);loadPage();}
window.changePage=changePage;
function resetFocus(){selected=0;setTimeout(function(){var targets=elem('main').getElementsByTagName('button');if(targets.length){targets[0].focus();}},70);}
function allFocus(){
 var list=document.getElementsByTagName('button'),out=[],i,b,rect,isPlaying=elem('videoPanel').style.display==='block';
 for(i=0;i<list.length;i++){
  b=list[i];rect=b.getBoundingClientRect();
  if(rect.width&&rect.height&&(!isPlaying||elem('videoPanel').contains(b)))out.push(b);
 }
 return out;
}
function activateFocused(){
 var a=document.activeElement;
 if(!a||a===document.body){var all=allFocus();a=all.length?all[0]:null;}
 if(a&&typeof a.click==='function'){a.click();return true;}
 if(a&&document.createEvent){var e=document.createEvent('MouseEvents');e.initEvent('click',true,true);a.dispatchEvent(e);return true;}
 return false;
}
function handleRemote(ev){
 ev=ev||window.event;
 if(ev._magHandled)return false;
 var k=ev.keyCode||ev.which,t=ev.target||ev.srcElement;
 if(k===29460)k=38;else if(k===29461)k=40;
 else if(k===4)k=37;else if(k===5)k=39;
 else if(k===29443)k=13;else if(k===88)k=461;
 var isInput=t&&t.tagName==='INPUT';
 if(isInput&&k!==27&&k!==461&&k!==10009&&k!==13&&k!==8)return true;
 if(k!==37&&k!==38&&k!==39&&k!==40&&k!==13&&k!==8&&k!==27&&k!==461&&k!==10009)return true;
 try{ev._magHandled=true;}catch(_){}
 if(ev.preventDefault)ev.preventDefault();ev.returnValue=false;
 if(k===8||k===27||k===461||k===10009){goBack();return false;}
 if(elem('videoPanel').style.display==='block'){if(k===13)closeVideo();return false;}
 if(nav==='home'){
  if(k===38)selectHomeCat((homeCatIndex+homeChoices.length-1)%homeChoices.length,false);
  if(k===40)selectHomeCat((homeCatIndex+1)%homeChoices.length,false);
  if(k===37)changeHomeCarousel(-1);
  if(k===39)changeHomeCarousel(1);
  if(k===13)go(homeCarouselPage===1?homeChoices[homeCatIndex].action:homeCards[homeCarouselPage].action);
  return false;
 }
 if(nav==='tv'||nav==='tamil'||nav==='entertainment'||nav==='culture'||nav==='movies'||nav==='sports'||nav==='news'||nav==='music'||nav==='kids'){
  if(k===13){if(magPane===0)chooseMagGroup(magGroupIndex);else chooseMagChannel(magRowIndex);}
  else if(k===37||k===39||k===38||k===40)navigateMag(k);
  return false;
 }
 if(k===13){if(isInput){if(nav==='search')searchNow();else if(nav==='mediabrowser')playMediaURL();}else activateFocused();return false;}
 if(k===37||k===38||k===39||k===40){
  var all=allFocus(),a=document.activeElement,i=all.indexOf(a),shift=(k===37||k===38)?-1:1;
  if(!all.length)return false;
  i=(i+shift+all.length)%all.length;all[i].focus();
  return false;
 }
 return false;
}
if(document.addEventListener)document.addEventListener('keydown',handleRemote,true);
window.onkeydown=handleRemote;

video.onerror=function(){
 if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}
 if(!isTestVideo&&currentStreamIndex+1<currentStreams.length){
  currentStreamIndex++;
  startSelectedStream();
 } else {
  videoMessage('No working source on this device. This may be a codec, location, or broadcaster restriction. Choose another channel.',true);
 }
};
video.onplaying=function(){if(playbackTimer){clearTimeout(playbackTimer);playbackTimer=null;}videoMessage(isTestVideo?'Diagnostic video playing':'Live video playing',false);};
clock();setInterval(clock,60000);
/* Render the complete home screen before any network handshake. */
go('home');
var connectionError='',connecting=false;
function connectPortal(){
 if(connecting)return;
 connecting=true;
 req('stb','handshake',{},function(error,token){
  if(error||!token||!token.token){
   connecting=false;
   connectionError='Unable to reach portal server. Check your internet connection and retry.';
   go('home');message(connectionError);return;
  }
  req('itv','get_genres',{},function(err,foundGroups){
   if(err||!foundGroups||!foundGroups.length){
    connecting=false;
    connectionError='Channel categories unavailable. Press RETRY CONNECTION.';
    go('home');message(connectionError);return;
   }
   groups=foundGroups;
   req('itv','get_ordered_list',{genre:'*',p:1},function(lastError,data){
    connecting=false;
    if(lastError||!data){
     connectionError='Channel directory could not be loaded. Press RETRY CONNECTION.';
    }else{
     channels.length=Number(data.total_items)||0;
     connectionError='';
    }
    go('home');
    if(connectionError)message(connectionError);
   });
  });
 });
}
function retryPortal(){connectionError='';connectPortal();}
window.retryPortal=retryPortal;
connectPortal();
})();
</script>
