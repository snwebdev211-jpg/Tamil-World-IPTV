<script>
(function(){
'use strict';
var BASE='/stalker_portal/server/load.php?JsHttpRequest=1-xml&';
var nav='home',genre='*',channels=[],groups=[],page=1,playing=null,video=document.getElementById('video'),selected=0;
var lastCategory='tv',favoriteIds=[],recentIds=[],lastChannelFocus=null,showMode='normal';
var currentStreams=[],currentStreamIndex=0;
var contentEpoch=0;
function readStore(k){try{var v=JSON.parse(window.localStorage.getItem(k)||'[]');return Object.prototype.toString.call(v)==='[object Array]'?v:[];}catch(e){return [];}}
function persist(){try{window.localStorage.setItem('snwd_santhos_favorites',JSON.stringify(favoriteIds));window.localStorage.setItem('snwd_santhos_recent',JSON.stringify(recentIds));}catch(e){}}
favoriteIds=readStore('snwd_santhos_favorites');
recentIds=readStore('snwd_santhos_recent');
var focusables=[], searchTerm='';
function elem(s){return document.getElementById(s);}
function txt(x){return String(x===undefined||x===null?'':x);}
function escapeHTML(s){return txt(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function req(type,action,params,done){
 var xhr=new XMLHttpRequest(),query=BASE+'type='+encodeURIComponent(type)+'&action='+encodeURIComponent(action),k;
 for(k in params){if(params.hasOwnProperty(k))query+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}
 xhr.open('GET',query,true);xhr.timeout=11000;
 var completed=false;function finish(err,data){if(completed)return;completed=true;done(err,data);}xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status===200){try{var obj=JSON.parse(xhr.responseText);finish(null,obj.js);}catch(e){finish('Invalid portal response');}}else{finish('Portal HTTP '+xhr.status);}}};
 xhr.ontimeout=function(){finish('Portal request timed out');};
 xhr.onerror=function(){finish('Cannot connect to portal backend');};
 xhr.send(null);
 setTimeout(function(){finish('Portal connection timed out');},12000);
}
function title(a,b){elem('main').innerHTML='<h1 class="headline">'+escapeHTML(a)+'</h1><p class="subhead">'+escapeHTML(b)+'</p><div id="status"></div><div id="cards"></div><div id="pageControls"></div>'; }
function message(x){if(elem('status'))elem('status').innerHTML=escapeHTML(x);}
function button(label,hint,action,icon){
 return '<button class="tile" data-action="'+escapeHTML(action)+'" onclick="tileAction(this)" type="button"><span class="icon">'+icon+'</span><span class="name">'+escapeHTML(label)+'</span><span class="hint">'+escapeHTML(hint)+'</span></button>';
}
function clock(){var d=new Date();elem('clock').innerHTML=d.toDateString().toUpperCase()+' &nbsp; '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
function setNav(n){var els=document.getElementsByClassName('menu'),i;for(i=0;i<els.length;i++)els[i].className='menu'+(els[i].id==='nav-'+n?' active':'');}

var homeCarouselPage=1,homeCatIndex=2;
var homeCards=[
 {title:'MEDIA BROWSER',hint:'Network media sources',action:'mediabrowser',photo:'/c/mag-media.jpg'},
 {title:'TV',hint:'Television channels',action:'tv',photo:'/c/mag-tv.jpg'},
 {title:'VIDEOCLUB',hint:'On-demand catalogue',action:'videoclub',photo:'/c/mag-videoclub.jpg'}
];
var homeChoices=[
 {title:'CULTURE',action:'culture'},
 {title:'TAMIL TV',action:'tamil'},
 {title:'ALL',action:'tv'},
 {title:'INFORMATION',action:'news'},
 {title:'ENTERTAINMENT',action:'entertainment'},
 {title:"CHILDREN'S",action:'kids'}
];
function classicGroupButton(i){
 var c=homeChoices[i];
 return '<button class="classic-category'+(homeCatIndex===i?' is-selected':'')+'" style="top:'+(10.2+i*14.05)+'%" data-cat="'+i+'" onclick="selectHomeCat('+i+',true)">'+escapeHTML(c.title)+'</button>';
}
function selectHomeCat(i,open){
 homeCatIndex=i;renderHomeCategories();
 if(open)go(homeChoices[i].action);
}
window.selectHomeCat=selectHomeCat;
function renderHomeCategories(){
 var box=elem('magCategories');
 if(!box)return;
 var h='<div class="classic-category-head">UP</div>';
 for(var i=0;i<homeChoices.length;i++)h+=classicGroupButton(i);
 box.innerHTML=h;
}
function homeCardHTML(c,i){
 var classes=['mag-left','mag-center','mag-right'];
 return '<div class="classic-card-box '+classes[i]+(homeCarouselPage===i?' mag-active':'')+'"><button class="classic-tile" data-module="'+i+'" onclick="selectHomeModule('+i+',true)" title="'+escapeHTML(c.hint)+'"><img src="'+c.photo+'" alt="'+escapeHTML(c.title)+'"></button><div class="classic-tile-name">'+escapeHTML(c.title)+'</div></div>';
}
function selectHomeModule(i,open){
 homeCarouselPage=(i+3)%3;renderHomeCarousel();
 if(open)go(homeCards[homeCarouselPage].action);
}
window.selectHomeModule=selectHomeModule;
function changeHomeCarousel(shift){selectHomeModule(homeCarouselPage+shift,false);}
window.changeHomeCarousel=changeHomeCarousel;
function renderHomeCarousel(){
 var box=elem('classic-carousel-cards');
 if(!box)return;
 var html='';
 for(var i=0;i<3;i++)html+=homeCardHTML(homeCards[i],i);
 box.innerHTML=html;
}
function home(){
 document.body.className='is-home';
 title('Santhos IPTV','Powered by SNWD');
 elem('cards').innerHTML=
 '<div class="classic-home">'+
  '<div class="classic-main"><div id="magCategories" class="classic-categories"></div>'+
  '<div class="classic-right"><div class="right-seal">SNWD</div><strong>SANTHOS IPTV</strong>'+
  '<p>YOUR WORLD ON SCREEN</p><button id="streamTestShortcut" class="classic-reconnect" onclick="go(&quot;settings&quot;)">STREAM TEST / SETTINGS · PRESS 0</button><p id="mag-info">Connecting to your channel directory…</p></div></div>'+
  '<div class="classic-carousel"><div id="classic-carousel-cards"></div></div>'+
 '</div>';
 renderHomeCategories();
 renderHomeCarousel();
 var info=elem('mag-info');
 if(info&&groups.length)info.innerHTML='TV CHANNELS<br>'+channels.length+' streams in the directory';
 if(info&&connectionError)info.innerHTML=escapeHTML(connectionError)+'<button class="classic-reconnect" onclick="retryPortal()">RECONNECT</button>';
}
function tileAction(el){go(el.getAttribute('data-action'));}
window.tileAction=tileAction;
var magTarget='tv',magGroupIndex=0,magRowIndex=0,magPane=0,magPages=1,magFilteredGroups=[],magPageItems=[];
function matchingGroups(target){
 var out=[],i,c,t;
 for(i=0;i<groups.length;i++){
  c=groups[i];if(c.id==='*')continue;t=(c.title||'').toLowerCase();
  if(target==='tamil'&&(c.alias||'').indexOf('Tamil |')!==0)continue;
  if(target==='entertainment'&&t.indexOf('entertain')<0)continue;
  if(target==='culture'&&t.indexOf('culture')<0)continue;
  if(target==='movies'&&t.indexOf('movie')<0)continue;
  if(target==='sports'&&t.indexOf('sport')<0)continue;
  if(target==='news'&&t.indexOf('news')<0&&t.indexOf('information')<0)continue;
  if(target==='music'&&t.indexOf('music')<0)continue;
  if(target==='kids'&&t.indexOf('kids')<0&&t.indexOf('family')<0)continue;
  out.push(c);
 }
 return out;
}
function categoryScreen(target){
 document.body.className='is-tv';
 magTarget=target;magFilteredGroups=matchingGroups(target);
 if(target==='tv')magFilteredGroups.unshift({id:'*',title:'ALL CHANNELS'});
 if(target==='tamil')magFilteredGroups.unshift({id:'__tamil__',title:'ALL TAMIL'});
 magGroupIndex=0;magRowIndex=0;magPane=0;page=1;genre=magFilteredGroups.length?magFilteredGroups[0].id:'__none__';searchTerm='';
 drawMagBrowser();loadMagChannels();
}
function drawMagBrowser(){
 title('TV','SELECT A CATEGORY AND CHANNEL');
 elem('cards').innerHTML='<div class="mag-browser"><div class="mag-groups" id="magGroups"></div><div class="mag-list" id="magList"></div>'+
 '<div class="mag-preview" id="magPreview"><div class="mag-preview-screen" id="magPreviewVideo"><div class="mag-preview-placeholder" id="magPreviewPlaceholder">Select a channel and press OK for live picture and sound.</div></div>'+
 '<div class="mag-preview-title" id="magPreviewTitle">LIVE TV PREVIEW</div><div class="mag-preview-status" id="magPreviewStatus">No channel playing</div>'+
 '<div class="mag-guide-title">TV GUIDE · LIVE</div><div class="mag-guide-rows" id="magGuide"><span class="live-badge">LIVE</span> &nbsp; Select a station to see its programme information.<p>Verified programme schedules are not supplied for these public streams.</p></div>'+
 '<div class="mag-preview-actions"><button onclick="viewSelectedFull()">RED · VIEW</button><button onclick="retryStream()">RETRY</button><button onclick="togglePreviewMute()" id="magMuteButton">GREEN · AUDIO ON</button><button onclick="magSwitchPage(-1)">◀ PAGE</button><button onclick="magSwitchPage(1)">PAGE ▶</button><button onclick="go(&quot;settings&quot;)">TEST</button></div></div></div>';
 renderMagGroups();renderMagEntries();
}
function renderMagGroups(){
 var e=elem('magGroups');if(!e)return;
 var start=Math.max(0,magGroupIndex-3);if(start>magFilteredGroups.length-7)start=Math.max(0,magFilteredGroups.length-7);
 var h='',i,g;
 for(i=start;i<Math.min(start+7,magFilteredGroups.length);i++){
  g=magFilteredGroups[i];
  h+='<button class="mag-group'+(magPane===0&&magGroupIndex===i?' mag-selected':'')+'" onclick="chooseMagGroup('+i+')" data-group="'+escapeHTML(g.id)+'">'+escapeHTML(g.title)+'</button>';
 }
 e.innerHTML=h||'<div class="empty">No channel categories.</div>';
}
function renderMagEntries(){
 var e=elem('magList');if(!e)return;
 var h='',i,ch,start=Math.max(0,magRowIndex-6);
 if(start>magPageItems.length-13)start=Math.max(0,magPageItems.length-13);
 if(!magPageItems.length)h='<div class="empty">No channels found in this category.</div>';
 for(i=start;i<Math.min(start+13,magPageItems.length);i++){
  ch=magPageItems[i];
  h+='<button class="mag-entry row'+(magPane===1&&magRowIndex===i?' mag-selected':'')+'" data-channel="'+escapeHTML(ch.id)+'" onclick="chooseMagChannel('+i+')">'+escapeHTML(ch.number+'. '+ch.name)+'</button>';
 }
 e.innerHTML=h;
}
function chooseMagGroup(i){
 if(i<0||i>=magFilteredGroups.length)return;
 magGroupIndex=i;magRowIndex=0;magPane=0;page=1;
 genre=magFilteredGroups[i].id;
 renderMagGroups();loadMagChannels();
}
window.chooseMagGroup=chooseMagGroup;
var previewChangeTimer=null,previewMode=false,requestedChannelEpoch=0;
function selectedChannelInfo(){
 var ch=magPageItems[magRowIndex],label=elem('magPreviewTitle'),guide=elem('magGuide');
 if(!ch)return;
 if(label)label.innerHTML=escapeHTML(ch.number+'. '+ch.name);
 if(guide)guide.innerHTML='<span class="live-badge">LIVE NOW</span> &nbsp; '+escapeHTML(ch.name)+
  '<p>Programme schedule unavailable. No verified EPG is currently provided for this station.</p>';
}
function chooseMagChannel(i){
 if(!magPageItems[i])return;
 magRowIndex=i;magPane=1;renderMagGroups();renderMagEntries();selectedChannelInfo();
 lastChannelFocus=null;
 if(previewMode&&String(playing)===String(magPageItems[i].id)){viewSelectedFull();return;}
 play(magPageItems[i].id);
}
window.chooseMagChannel=chooseMagChannel;
function schedulePreview(){
 selectedChannelInfo();
 if(previewChangeTimer){clearTimeout(previewChangeTimer);previewChangeTimer=null;}
 if(!previewMode||!magPageItems[magRowIndex])return;
 previewChangeTimer=setTimeout(function(){
  previewChangeTimer=null;
  if(elem('magPreviewVideo')&&elem('videoPanel').style.display!=='block')play(magPageItems[magRowIndex].id);
 },450);
}
function viewSelectedFull(){
 var ch=magPageItems[magRowIndex];
 if(!ch)return;
 if(previewMode&&String(playing)===String(ch.id)&&currentStreams.length){goFullScreen();return;}
 play(ch.id,true);
}
window.viewSelectedFull=viewSelectedFull;
function updateAudioButton(){
 var btn=elem('magMuteButton');
 if(btn)btn.innerHTML=video.muted?'GREEN · AUDIO OFF (TURN ON)':'GREEN · AUDIO ON';
}
function togglePreviewMute(){
 video.muted=!video.muted;
 updateAudioButton();
 if(!video.muted){
  // A direct remote key/button gesture can unlock sound when autoplay could not.
  try{
   var resumed=video.play();
   if(resumed&&typeof resumed['catch']==='function'){
    var epoch=playEpoch,source=currentStreams[currentStreamIndex]||video.currentSrc||video.src;
    resumed['catch'](function(e){handlePlaybackRejection(e,epoch,source);});
   }
  }catch(e){handlePlaybackRejection(e,playEpoch,currentStreams[currentStreamIndex]||video.src);}
 }else videoMessage('Audio muted by user. Press GREEN to turn sound on.',false);
}
window.togglePreviewMute=togglePreviewMute;
function magSwitchPage(step){
 if(page+step<1||page+step>magPages)return;
 page+=step;magRowIndex=0;loadMagChannels();
}
window.magSwitchPage=magSwitchPage;
function loadMagChannels(){
 var epoch=++contentEpoch;
 message('Loading channels…');
 req('itv','get_ordered_list',{genre:genre,p:page,search:searchTerm},function(err,response){
  if(epoch!==contentEpoch)return;
  if(err||!response||response.error){magPageItems=[];message(err||(response&&response.error)||'Cannot load channels');renderMagEntries();return;}
  magPageItems=response.data||[];magPages=Math.max(1,Math.ceil((Number(response.total_items)||0)/50));
  magRowIndex=0;renderMagEntries();selectedChannelInfo();
  var count=(Number(response.total_items)||0);
  message(count+' channels · page '+page+'/'+magPages+
   (magTarget==='tamil'?' · Sun TV / KTV / Sun Music are not in this public catalogue.':'')+
   ' · LEFT/RIGHT: category/channel · OK: preview · RED: view');
 });
}
function navigateMag(dir){
 if(!magFilteredGroups.length)return;
 if(dir===37)magPane=0;
 else if(dir===39){if(magPane===0)chooseMagGroup(magGroupIndex);magPane=1;}
 else if(dir===38){
  if(magPane===0)magGroupIndex=(magGroupIndex-1+magFilteredGroups.length)%magFilteredGroups.length;
  else magRowIndex=Math.max(0,magRowIndex-1);
 }else if(dir===40){
  if(magPane===0)magGroupIndex=(magGroupIndex+1)%magFilteredGroups.length;
  else magRowIndex=Math.min(Math.max(magPageItems.length-1,0),magRowIndex+1);
 }
 renderMagGroups();renderMagEntries();
 if(magPane===1)schedulePreview();
}
function renderRows(items,total,current){
 var h='<button id="goBack" onclick="goBack()">← Back to categories</button>',i,c,marked;
 if(!items.length){elem('cards').innerHTML=h+'<div class="empty">No matching channels found. This may also indicate a temporary upstream outage.</div>';resetFocus();return;}
 for(i=0;i<items.length;i++){
   c=items[i];var number=escapeHTML(c.number),name=escapeHTML(c.name);
   marked=favoriteIds.indexOf(String(c.id))!==-1;
   h+='<div class="channel-line"><button class="row" data-channel="'+escapeHTML(c.id)+'" onclick="chooseChannel(this)" type="button">'+(c.logo?'<img src="'+escapeHTML(c.logo)+'" alt="" onerror="this.style.display=\'none\'">':'')+number+'. '+name+'<small>LIVE &nbsp;·&nbsp; Select to try playback</small></button><button class="star" onclick="toggleFavorite(\''+escapeHTML(c.id)+'\')" title="'+(marked?'Remove favorite':'Save favorite')+'">'+(marked?'♥':'♡')+'</button></div>';
 }
 elem('cards').innerHTML=h;
 var controls='';
 if(current>1)controls+='<button onclick="changePage(-1)">← PREVIOUS</button>';
 if(current*50<total)controls+='<button onclick="changePage(1)">NEXT →</button>';
 controls+=' &nbsp; '+escapeHTML('Page '+current+' · '+total+' channels');
 elem('pageControls').innerHTML=controls;
 message('TV channels · '+total+' total · some streams may fail depending on location or codec.');
 resetFocus();
}
function loadGroup(id){

  'Playback started; confirm both picture and sound on the television.',false);
};
clock();setInterval(clock,60000);
/* Render the complete home screen before any network handshake. */
go('home');
var connectionError='',connecting=false;
function connectPortal(){
 if(connecting)return;
 connecting=true;
 req('stb','handshake',{},function(error,token){
  if(error||!token||!token.token){
   connecting=false;
   connectionError='Unable to reach portal server. Check your internet connection and retry.';
   if(nav==='home')home();return;
  }
  req('itv','get_genres',{},function(err,foundGroups){
   if(err||!foundGroups||!foundGroups.length){
    connecting=false;
    connectionError='Channel categories unavailable. Press RETRY CONNECTION.';
    if(nav==='home')home();return;
   }
   groups=foundGroups;
   req('itv','get_ordered_list',{genre:'*',p:1},function(lastError,data){
    connecting=false;
    if(lastError||!data){
     connectionError='Channel directory could not be loaded. Press RETRY CONNECTION.';
    }else{
     channels.length=Number(data.total_items)||0;
     connectionError='';
    }
    if(nav==='home')home();
   });
  });
 });
}
function retryPortal(){connectionError='';connectPortal();}
window.retryPortal=retryPortal;
connectPortal();
})();
</script>
